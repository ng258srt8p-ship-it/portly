name = "portly-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "portly-db"
database_id = "4d7787e9-9eea-4403-81a5-469a4ba2a5fb"

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "4ddbcf807f444e62855dc3ff4216a30d"

# Environment variables (single merged section)
[vars]
API_VERSION = "1.0"

# Cloudflare Workers AI binding — for cruise-insight enrichment (free tier 10k neurons/day)
[ai]
binding = "AI"

# Cron Trigger — every 4 hours, scrape all cruise line URLs via Jina Reader
[triggers]
crons = ["0 */4 * * *"]
